# Only pods labelled postgres-access=true in the same namespace may reach PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-labelled-clients
  namespace: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              postgres-access: "true"
      ports:
        - protocol: TCP
          port: 5432
